name: Create CTD linksets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CTD snapshot date (YYYY-MM-DD; default: today's date)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependency
        run: python3 -m pip install requests

      - name: Restore linkset-creator jar from cache
        uses: actions/cache@v6
        id: cache-jar
        with:
          path: ./linkset-creator-v2.0.jar
          key: cached-linkset-creator-v2.0-jar

      - name: Download linkset-creator jar if cache missed
        if: steps.cache-jar.outputs.cache-hit != 'true'
        run: |
          wget -O linkset-creator-v2.0.jar \
            https://github.com/CyTargetLinker/linksetCreator/releases/download/v2.0/linkset-creator-v2.0.jar

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # CTD.py downloads CTD_chem_gene_ixns.csv.gz and creates one dated TXT
      # file per configured species under CTD_outputs/.
      - name: Download and split CTD by species
        env:
          CTD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$CTD_VERSION" ]; then
            python3 CTD/CTD.py --date "$CTD_VERSION"
          else
            python3 CTD/CTD.py
          fi
          if [ -z "$CTD_VERSION" ]; then
            CTD_VERSION=$(date -u +%Y-%m-%d)
          fi
          echo "CTD_VERSION=$CTD_VERSION" >> "$GITHUB_ENV"
          ls -lh CTD_outputs/

      # CTD_config contains the committed, species-specific linkset-creator
      # configs (e.g. CTD_config/CTD_cel.config). The manifest ties each
      # species code to its dated input, config and XGMML output.
      - name: Build each CTD species linkset and run QC
        env:
          CTD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p bridgedb
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            https://raw.githubusercontent.com/bridgedb/data/main/gene.json \
            -o build_gene.json
          if [ -z "$CTD_VERSION" ]; then
            CTD_VERSION=$(date -u +%Y-%m-%d)
          fi
          mkdir -p build/ctd
          printf 'code\torganism\tbridge_species\tinput\tconfig\toutput\n' > build/ctd/manifest.tsv

          while IFS='|' read -r code token organism bridge_species syscodes; do
            [ -z "$code" ] && continue
            echo "::group::Building $organism ($code)"
            bridge_url=$(jq -r --arg organism "$bridge_species" \
              '.mappingFiles[] | select(.species == $organism) | .downloadURL' \
              build_gene.json)
            if [ -z "$bridge_url" ] || [ "$bridge_url" = "null" ]; then
              echo "No BridgeDb mapping file found for '$bridge_species'"
              exit 1
            fi

            # CTD configs map GeneID (NCBI Entrez) on the target side.
            # All five configured species use their short-code bridge path.
            scripts/fetch-bridge.sh "$bridge_url" "bridgedb/${code}.bridge"

            input="CTD_outputs/CTD_${CTD_VERSION}_${token}.txt"
            config="CTD/CTD_config/CTD_${code}.config"
            output="CTD_${code}_${CTD_VERSION}.xgmml"
            test -s "$input" || { echo "Missing or empty input: $input"; exit 1; }
            test -s "$config" || { echo "Missing config: $config"; exit 1; }

            echo "Building $organism using $config"
            java -Dfile.encoding=UTF-8 -jar linkset-creator-v2.0.jar \
              -c "$config" -i "$input" -o "$output"

            python3 scripts/qc_xgmml.py \
              --min-nodes 1 --min-edges 1 \
              --mapped-type gene --min-mapped-frac 0.80 \
              --labelled-type gene \
              "$output"

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$code" "$organism" "$bridge_species" "$input" "$config" "$output" \
              >> build/ctd/manifest.tsv
            rm -f "bridgedb/${code}.bridge"
            echo "::endgroup::"
          done <<'SPECIES'
          cel|caenorhabditis_elegans|Caenorhabditis elegans|Caenorhabditis elegans|En,L,S
          dre|danio_rerio|Danio rerio|Danio rerio|En,L,S
          gga|gallus_gallus|Gallus gallus|Gallus gallus|En,L,S
          hsa|homo_sapiens|Homo sapiens|Homo sapiens|En,H,L,S
          mmu|mus_musculus|Mus musculus|Mus musculus|En,L,S
          SPECIES

          cat build/ctd/manifest.tsv

      - name: Upload CTD XGMML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CTD-linksets-${{ env.CTD_VERSION }}
          path: |
            CTD_*_${{ env.CTD_VERSION }}.xgmml
            build/ctd/manifest.tsv
