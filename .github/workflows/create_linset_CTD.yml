name: Create CTD linksets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CTD snapshot "
        required: false
        type: string
      skip_species:
        description: "Build and QC only; publishing is not configured in this workflow"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Restore linkset-creator jar from cache
        uses: actions/cache@v6
        id: cache-jar
        with:
          path: ./linkset-creator-v2.0.jar
          key: cached-linkset-creator-v2.0-jar

      - name: Download linkset-creator jar if cache missed
        if: steps.cache-jar.outputs.cache-hit != 'true'
        run: |
          wget -O linkset-creator-v2.0.jar \
            https://github.com/CyTargetLinker/linksetCreator/releases/download/v2.0/linkset-creator-v2.0.jar

      # CTD.py reads CTD/species.tsv and CTD/input/CTD_<date>_<input_token>.txt,
      # creates build/ctd/input_<code>.txt, a per-species config, and a manifest.
      - name: Prepare CTD inputs and configs
        env:
          CTD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$CTD_VERSION" ]; then
            args+=(--version "$CTD_VERSION")
          fi
          python3 CTD/ctd.py prepare "${args[@]}"
          echo "CTD_VERSION=$(cat build/ctd/version.txt)" >> "$GITHUB_ENV"
          cat build/ctd/manifest.json

      # The CTD preprocessor generates configs in CTD/config by default.
      # If the repository stores/uses CTD_config instead, change this config
      # path in CTD.py or point the build command there consistently.
      - name: Build CTD XGMML files and run QC
        run: |
          set -euo pipefail
          python3 CTD/ctd.py build --jar linkset-creator-v2.0.jar
          mkdir -p build/ctd/xgmml
          while IFS= read -r output; do
            mv "$output" build/ctd/xgmml/
          done < <(python3 -c 'import json; m=json.load(open("build/ctd/manifest.json")); print("\n".join(s["output"] for s in m["species"]))')
          ls -lh build/ctd/xgmml/

      - name: Upload CTD XGMML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CTD-linksets-${{ env.CTD_VERSION }}
          path: |
            build/ctd/xgmml/*.xgmml
            build/ctd/manifest.json
            build/ctd/version.txt
